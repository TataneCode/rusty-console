name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: rusty_console

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: rusty_console
            asset_name: rusty_console-linux-x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: rusty_console.exe
            asset_name: rusty_console-windows-x86_64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build RPM (Linux)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo install cargo-generate-rpm --locked
          cargo generate-rpm --target ${{ matrix.target }} -o target/${{ matrix.target }}/release/rusty_console-linux-x86_64.rpm

      - name: Build DEB (Linux)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo install cargo-deb --locked
          cargo deb --target ${{ matrix.target }} --no-build -o target/${{ matrix.target }}/release/rusty_console-linux-x86_64-amd64.deb

      - name: Build MSI (Windows)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          dotnet tool install --global wix
          cargo install cargo-wix --locked
          # --migrate global is a no-op on already-v4 wxs files but restores
          # missing WiX extension packages (WixToolset.UI.wixext is required by
          # wix/main.wxs). Without it, `wix build` fails with "Could not build
          # installer" and the whole release ends up with no assets.
          cargo wix --toolset modern --migrate global --target ${{ matrix.target }} --no-build --output target/${{ matrix.target }}/release/rusty_console-windows-x86_64.msi
          if (-Not (Test-Path "target/${{ matrix.target }}/release/rusty_console-windows-x86_64.msi")) { throw "MSI was not produced" }

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      - name: Upload RPM installer artifact
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@v4
        with:
          name: rusty_console-linux-x86_64.rpm
          path: target/${{ matrix.target }}/release/rusty_console-linux-x86_64.rpm

      - name: Upload DEB installer artifact
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@v4
        with:
          name: rusty_console-linux-x86_64-amd64.deb
          path: target/${{ matrix.target }}/release/rusty_console-linux-x86_64-amd64.deb

      - name: Upload MSI installer artifact
        if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: actions/upload-artifact@v4
        with:
          name: rusty_console-windows-x86_64.msi
          path: target/${{ matrix.target }}/release/rusty_console-windows-x86_64.msi

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          find artifacts -type f -print0 | while IFS= read -r -d '' file; do
            cp "$file" "release/$(basename "$file")"
          done
          chmod +x release/* 2>/dev/null || true
          ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
