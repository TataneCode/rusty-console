name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: rusty_console

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact_name: rusty_console
            asset_name: rusty_console-linux-x86_64
          - target: x86_64-pc-windows-gnu
            artifact_name: rusty_console.exe
            asset_name: rusty_console-windows-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-zigbuild (bundles a modern zig/mingw-w64 toolchain)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: pip3 install cargo-zigbuild

      - name: Build
        if: matrix.target != 'x86_64-pc-windows-gnu'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Cross build (Windows)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Build RPM (Linux)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo install cargo-generate-rpm --locked
          cargo generate-rpm --target ${{ matrix.target }} -o target/${{ matrix.target }}/release/rusty_console-linux-x86_64.rpm

      - name: Build DEB (Linux)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo install cargo-deb --locked
          cargo deb --target ${{ matrix.target }} --no-build -o target/${{ matrix.target }}/release/rusty_console-linux-x86_64-amd64.deb

      - name: Package Windows zip
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: zip -j "target/${{ matrix.target }}/release/rusty_console-windows-x86_64.zip" "target/${{ matrix.target }}/release/rusty_console.exe"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
          if-no-files-found: error

      - name: Upload RPM installer artifact
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@v4
        with:
          name: rusty_console-linux-x86_64.rpm
          path: target/${{ matrix.target }}/release/rusty_console-linux-x86_64.rpm
          if-no-files-found: error

      - name: Upload DEB installer artifact
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@v4
        with:
          name: rusty_console-linux-x86_64-amd64.deb
          path: target/${{ matrix.target }}/release/rusty_console-linux-x86_64-amd64.deb
          if-no-files-found: error

      - name: Upload Windows zip artifact
        if: matrix.target == 'x86_64-pc-windows-gnu'
        uses: actions/upload-artifact@v4
        with:
          name: rusty_console-windows-x86_64.zip
          path: target/${{ matrix.target }}/release/rusty_console-windows-x86_64.zip
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          find artifacts -type f -print0 | while IFS= read -r -d '' file; do
            cp "$file" "release/$(basename "$file")"
          done
          chmod +x release/* 2>/dev/null || true
          ls -la release/

      - name: Generate categorized release notes
        run: |
          tag="${GITHUB_REF_NAME}"
          prev_tag="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"
          if [ -n "$prev_tag" ]; then
            range="${prev_tag}..${tag}"
            changelog_url="https://github.com/${GITHUB_REPOSITORY}/compare/${prev_tag}...${tag}"
          else
            range="${tag}"
            changelog_url="https://github.com/${GITHUB_REPOSITORY}/commits/${tag}"
          fi

          {
            printf "## What's Changed\n"
            git log --no-merges --format='%s' "${range}" | awk '
              {
                s = tolower($0)
                if (s ~ /^feat(\(.+\))?!?:/)                                           { f[++nf] = "✨ " $0; next }
                if (s ~ /^fix(\(.+\))?!?:/)                                            { b[++nb] = "🐛 " $0; next }
                if (s ~ /^(refactor|perf|style|build|ci|docs|chore|test)(\(.+\))?!?:/) { r[++nr] = "🔧 " $0; next }
                o[++no] = "• " $0
              }
              END {
                if (nf) { print "\n### ✨ Features";                     for (i = 1; i <= nf; i++) print f[i] }
                if (nb) { print "\n### 🐛 Bug Fixes";                    for (i = 1; i <= nb; i++) print b[i] }
                if (nr) { print "\n### 🔧 Refactoring, CI & Chores";     for (i = 1; i <= nr; i++) print r[i] }
                if (no) { print "\n### • Other";                        for (i = 1; i <= no; i++) print o[i] }
              }
            '
            printf "\n**Full Changelog**: %s\n" "${changelog_url}"
          } > release_notes.md
          cat release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body-path: release_notes.md
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
