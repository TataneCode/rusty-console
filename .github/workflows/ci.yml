name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always


jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test

  integration:
    name: Integration (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify Docker daemon
        run: docker version
      - name: Run integration tests
        run: cargo test --test integration_docker
      - name: Run breadcrumb UI integration tests
        run: cargo test --test breadcrumb_ui
      - name: Run action bar UI integration tests
        run: cargo test --test action_bar_ui

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-tarpaulin
      - run: cargo tarpaulin --lib --ignore-tests --fail-under 70 --out Stdout

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-2025-vs2026]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release

  package-linux:
    name: Package (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --target x86_64-unknown-linux-gnu
      - name: Build RPM
        run: |
          cargo install cargo-generate-rpm --locked
          cargo generate-rpm --target x86_64-unknown-linux-gnu -o target/x86_64-unknown-linux-gnu/release/rusty_console-linux-x86_64.rpm
          test -f target/x86_64-unknown-linux-gnu/release/rusty_console-linux-x86_64.rpm
      - name: Build DEB
        run: |
          cargo install cargo-deb --locked
          cargo deb --target x86_64-unknown-linux-gnu --no-build -o target/x86_64-unknown-linux-gnu/release/rusty_console-linux-x86_64-amd64.deb
          test -f target/x86_64-unknown-linux-gnu/release/rusty_console-linux-x86_64-amd64.deb

  package-windows:
    name: Package (Windows zip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-zigbuild (bundles a modern zig/mingw-w64 toolchain)
        run: pip3 install cargo-zigbuild
      - name: Cross build Windows release binary
        run: cargo zigbuild --release --target x86_64-pc-windows-gnu
      - name: Package zip
        run: |
          zip -j target/x86_64-pc-windows-gnu/release/rusty_console-windows-x86_64.zip target/x86_64-pc-windows-gnu/release/rusty_console.exe
          test -f target/x86_64-pc-windows-gnu/release/rusty_console-windows-x86_64.zip
