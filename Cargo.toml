[package]
name = "rusty_console"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "A Docker TUI console built with Rust, Ratatui and Bollard"
repository = "https://github.com/TataneCode/rusty-console"

[dependencies]
# Docker registry auth decoding (already in Cargo.lock via bollard)
base64 = "0.22"
# TUI Framework
ratatui = "0.30"
crossterm = "0.29"

# Docker API
bollard = "0.21"

# Async streams
futures-util = "0.3"

# Async Runtime
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs"] }

# Async traits
async-trait = "0.1"

# Error Handling
anyhow = "1.0"
thiserror = "2.0"

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
mockall = "0.14"
tokio-test = "0.4"

# RPM packaging (cargo-generate-rpm). The binary is installed system-wide and
# executable bits are set via `mode = "755"`.
[package.metadata.generate-rpm]
assets = [
    { source = "target/x86_64-unknown-linux-gnu/release/rusty_console", dest = "/usr/bin/rusty_console", mode = "755" },
    { source = "LICENSE", dest = "/usr/share/licenses/rusty_console/LICENSE", mode = "644", doc = true },
]
